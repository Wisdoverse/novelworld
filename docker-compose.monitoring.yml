# Monitoring profile (H2 production-readiness): Prometheus collectors +
# Grafana dashboard + alert rules for the private self-hosted deployment.
# Optional overlay: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# Requires GRAFANA_ADMIN_PASSWORD in the environment. Notification routing
# (Alertmanager) is deferred to H5; see docs/OPERATIONS.md.
services:
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: ${CONTAINER_PREFIX:-novel}-prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - novel-net
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9090/-/healthy]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.0-ubuntu@sha256:2f6f8ae789c142f0ee00d355cbd9a00bf3149ae255876c3caa8b08ee74fc8791
    container_name: ${CONTAINER_PREFIX:-novel}-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set for the monitoring profile}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_HTTP_PORT:-127.0.0.1:13000}:3000"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - novel-net
    restart: unless-stopped
