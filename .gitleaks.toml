title = "NovelWorld Gitleaks configuration"
minVersion = "8.24.3"

[extend]
useDefault = true

[allowlist]
description = "NovelWorld test-only fixtures and non-secret model identifiers"
regexes = [
    # Fixed smoke-test encryption key; never accepted as a production secret.
    "0123456789abcdef(0123456789abcdef){3}",
    # Provider model identifiers, not credentials.
    "^claude-haiku-4-5-20251001$",
    "^claude-3-5-haiku-20241022$",
    # Retired fake PAT retained only in Git history for the scanner self-test.
    "^ghp_yLe6KfOpEa3LrYztSpjqGPY4pBvg4UvKCrSg$",
]
