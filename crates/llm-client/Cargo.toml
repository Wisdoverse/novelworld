[package]
name = "llm-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Unified LLM client supporting OpenAI, Anthropic, Gemini, and OpenAI-compatible providers"

[dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"
bytes = "1"
async-stream.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
