services:
  llm-stub:
    image: python:3.13.15-slim-bookworm@sha256:c45a22ea000adfd9cda29364bbe7edd23001ce5cc2ad15857cfbf7766943b9ca
    working_dir: /app
    command: [python3, mock_openai.py]
    volumes:
      - ./tests/e2e:/app:ro
    networks:
      - novel-net
    ports:
      - 127.0.0.1:18080:18080
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health')"]
      interval: 1s
      timeout: 2s
      retries: 10

  user-service:
    environment:
      LLM_API_URL: http://llm-stub:18080
    depends_on:
      llm-stub:
        condition: service_healthy

  novel-service:
    environment:
      LLM_API_URL: http://llm-stub:18080
      LLM_ALLOW_INSECURE_HTTP: "true"
      IMAGE_GEN_API_URL: http://llm-stub:18080
      IMAGE_GEN_API_KEY: e2e-only
    depends_on:
      llm-stub:
        condition: service_healthy

  agent-service:
    environment:
      LLM_API_URL: http://llm-stub:18080
      LLM_ALLOW_INSECURE_HTTP: "true"
      EMBEDDING_API_URL: http://llm-stub:18080
    depends_on:
      llm-stub:
        condition: service_healthy

  narrative-service:
    environment:
      LLM_API_URL: http://llm-stub:18080
      LLM_ALLOW_INSECURE_HTTP: "true"
    depends_on:
      llm-stub:
        condition: service_healthy

  gateway:
    ports:
      - 127.0.0.1:18081:8080
