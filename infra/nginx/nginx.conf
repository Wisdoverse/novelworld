worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    limit_req_zone $binary_remote_addr zone=api_per_client:10m rate=20r/s;

    # 上传大小限制（小说文件）
    client_max_body_size 50M;

    # SSE 超时（角色流式对话）
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    upstream gateway {
        server gateway:8080;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        error_page 429 = @rate_limited;

        # Baseline security posture for the private preview (H2): nosniff,
        # clickjacking denial, and a privacy-scoped referrer policy. TLS
        # termination stays operator-provided; these headers are not a
        # substitute for it. NOTE: nginx add_header inheritance drops this
        # list inside any location that sets its own add_header, so such
        # locations must repeat the three headers.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        # 健康检查
        location /nginx-health {
            return 200 "ok\n";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            add_header Content-Type text/plain;
        }

        # API 请求 → Gateway
        location /api/ {
            limit_req zone=api_per_client burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # SSE 支持（角色流式对话）
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # Public gateway probes.
        location ~ ^/(live|health|ready)$ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Metrics remain available only on the internal gateway network.
        location = /metrics {
            return 404;
        }

        # 前端静态资源
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # SPA 路由支持
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            proxy_pass http://frontend;
        }

        location @rate_limited {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            add_header Retry-After 1 always;
            return 429 '{"error":{"code":"rate_limited","message":"Rate limit exceeded"}}';
        }
    }
}
