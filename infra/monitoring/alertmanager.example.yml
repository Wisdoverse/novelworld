# Copy this file outside the checkout. Replace the URL with your authorized receiver.
# The receiver must accept the standard Alertmanager webhook JSON payload.
global:
  http_config:
    follow_redirects: false

route:
  receiver: operator
  group_by: [alertname, job, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: operator
    webhook_configs:
      - url: https://alerts.example.invalid/novelworld
        send_resolved: true
        timeout: 10s
        max_alerts: 100
