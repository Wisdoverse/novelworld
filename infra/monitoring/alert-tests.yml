rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # up == 0 for one instance: InstanceDown fires after 30s (for: 30s).
      - series: 'up{job="gateway",instance="gateway:8080"}'
        values: '0x6'
      # Incrementing counters: 6% 429 ratio on /api sustained for 10m fires
      # the rate-limit alert (rate of a flat counter is always zero).
      - series: 'http_requests_total{job="gateway",path="/api/chat/:id/stream",status="200"}'
        values: '94+94x11'
      - series: 'http_requests_total{job="gateway",path="/api/chat/:id/stream",status="429"}'
        values: '6+6x11'
      # 3% 5xx ratio overall sustained for 10m fires the error-ratio alert.
      - series: 'http_requests_total{job="gateway",path="/api/chat/:id/stream",status="500"}'
        values: '3+3x11'
    alert_rule_test:
      - eval_time: 2m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: gateway:8080
              job: gateway
            exp_annotations:
              summary: Instance gateway:8080 is down
              runbook: docs/OPERATIONS.md - health checks; restart the named service
      - eval_time: 10m
        alertname: GatewayRateLimitRejections
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Gateway rate-limit rejections above 5% over 5 minutes
              runbook: docs/OPERATIONS.md#single-node-v1-slo-and-capacity-contract - overload admission; check RATE_LIMIT_RPS
      - eval_time: 10m
        alertname: HighErrorRatio
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Gateway 5xx ratio above 2% over 5 minutes
              runbook: docs/OPERATIONS.md - bad-release / provider outage playbooks

  # Import-state expressions use instant vectors and never display stale values.
  - interval: 15s
    input_series:
      - series: 'up{job="novel-service",instance="novel:8002"}'
        values: '1'
      - series: 'novelworld_import_jobs_observation_success{job="novel-service",instance="novel:8002"}'
        values: '1'
      - series: 'novelworld_import_jobs{job="novel-service",instance="novel:8002",status="pending"}'
        values: '2'
      - series: 'novelworld_import_jobs{job="novel-service",instance="novel:8002",status="in_progress"}'
        values: '1'
      - series: 'novelworld_import_jobs{job="novel-service",instance="novel:8002",status="failed"}'
        values: '3'
      - series: 'novelworld_import_jobs{job="novel-service",instance="novel:8002",status="completed"}'
        values: '7'
    promql_expr_test:
      - expr: >-
          novelworld_import_jobs{job="novel-service"} AND on(job,instance) novelworld_import_jobs_observation_success{job="novel-service"} == 1 AND on(job,instance) up{job="novel-service"} == 1
        eval_time: 0s
        exp_samples:
          - labels: 'novelworld_import_jobs{instance="novel:8002",job="novel-service",status="pending"}'
            value: 2
          - labels: 'novelworld_import_jobs{instance="novel:8002",job="novel-service",status="in_progress"}'
            value: 1
          - labels: 'novelworld_import_jobs{instance="novel:8002",job="novel-service",status="failed"}'
            value: 3
          - labels: 'novelworld_import_jobs{instance="novel:8002",job="novel-service",status="completed"}'
            value: 7
      - expr: >-
          novelworld_import_jobs_observation_success{job="novel-service"} AND on(job,instance) up{job="novel-service"} == 1
        eval_time: 0s
        exp_samples:
          - labels: 'novelworld_import_jobs_observation_success{instance="novel:8002",job="novel-service"}'
            value: 1
  - interval: 15s
    input_series:
      - series: 'up{job="novel-service",instance="novel:8002"}'
        values: '1'
      - series: 'novelworld_import_jobs_observation_success{job="novel-service",instance="novel:8002"}'
        values: '1'
      - series: 'novelworld_import_jobs{job="novel-service",instance="novel:8002",status="pending"}'
        values: '0'
      - series: 'novelworld_import_jobs{job="novel-service",instance="novel:8002",status="in_progress"}'
        values: '0'
      - series: 'novelworld_import_jobs{job="novel-service",instance="novel:8002",status="failed"}'
        values: '0'
      - series: 'novelworld_import_jobs{job="novel-service",instance="novel:8002",status="completed"}'
        values: '0'
    promql_expr_test:
      - expr: >-
          novelworld_import_jobs{job="novel-service"} AND on(job,instance) novelworld_import_jobs_observation_success{job="novel-service"} == 1 AND on(job,instance) up{job="novel-service"} == 1
        eval_time: 0s
        exp_samples:
          - labels: 'novelworld_import_jobs{instance="novel:8002",job="novel-service",status="pending"}'
            value: 0
          - labels: 'novelworld_import_jobs{instance="novel:8002",job="novel-service",status="in_progress"}'
            value: 0
          - labels: 'novelworld_import_jobs{instance="novel:8002",job="novel-service",status="failed"}'
            value: 0
          - labels: 'novelworld_import_jobs{instance="novel:8002",job="novel-service",status="completed"}'
            value: 0
      - expr: >-
          novelworld_import_jobs_observation_success{job="novel-service"} AND on(job,instance) up{job="novel-service"} == 1
        eval_time: 0s
        exp_samples:
          - labels: 'novelworld_import_jobs_observation_success{instance="novel:8002",job="novel-service"}'
            value: 1
  # Observation failure with old counts: no count samples, status remains Unknown.
  - interval: 15s
    input_series:
      - series: 'up{job="novel-service",instance="novel:8002"}'
        values: '1'
      - series: 'novelworld_import_jobs_observation_success{job="novel-service",instance="novel:8002"}'
        values: '0'
      - series: 'novelworld_import_jobs{job="novel-service",instance="novel:8002",status="failed"}'
        values: '3'
    promql_expr_test:
      - expr: >-
          novelworld_import_jobs{job="novel-service"} AND on(job,instance) novelworld_import_jobs_observation_success{job="novel-service"} == 1 AND on(job,instance) up{job="novel-service"} == 1
        eval_time: 0s
        exp_samples: []
      - expr: >-
          novelworld_import_jobs_observation_success{job="novel-service"} AND on(job,instance) up{job="novel-service"} == 1
        eval_time: 0s
        exp_samples:
          - labels: 'novelworld_import_jobs_observation_success{instance="novel:8002",job="novel-service"}'
            value: 0
  # Prior success/counts cannot survive a down target in either panel.
  - interval: 15s
    input_series:
      - series: 'up{job="novel-service",instance="novel:8002"}'
        values: '0'
      - series: 'novelworld_import_jobs_observation_success{job="novel-service",instance="novel:8002"}'
        values: '1'
      - series: 'novelworld_import_jobs{job="novel-service",instance="novel:8002",status="completed"}'
        values: '7'
    promql_expr_test:
      - expr: >-
          novelworld_import_jobs{job="novel-service"} AND on(job,instance) novelworld_import_jobs_observation_success{job="novel-service"} == 1 AND on(job,instance) up{job="novel-service"} == 1
        eval_time: 0s
        exp_samples: []
      - expr: >-
          novelworld_import_jobs_observation_success{job="novel-service"} AND on(job,instance) up{job="novel-service"} == 1
        eval_time: 0s
        exp_samples: []
  # Missing observation is not zero and must not reveal prior count inputs.
  - interval: 15s
    input_series:
      - series: 'up{job="novel-service",instance="novel:8002"}'
        values: '1'
      - series: 'novelworld_import_jobs{job="novel-service",instance="novel:8002",status="completed"}'
        values: '7'
    promql_expr_test:
      - expr: >-
          novelworld_import_jobs{job="novel-service"} AND on(job,instance) novelworld_import_jobs_observation_success{job="novel-service"} == 1 AND on(job,instance) up{job="novel-service"} == 1
        eval_time: 0s
        exp_samples: []
      - expr: >-
          novelworld_import_jobs_observation_success{job="novel-service"} AND on(job,instance) up{job="novel-service"} == 1
        eval_time: 0s
        exp_samples: []
