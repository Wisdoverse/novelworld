[workspace]
resolver = "2"

members = [
    "gateway",
    "services/novel-service",
    "services/agent-service",
    "services/narrative-service",
    "services/user-service",
    "crates/llm-client",
    "tests/integration",
    "tools/h3-eval",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["multipart", "ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }

# gRPC
tonic = "0.14"
prost = "0.14"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.19"
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP client (for LLM API)
reqwest = { version = "0.13", features = ["json", "stream"] }

# Redis
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.23"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = "0.15"
dotenvy = "0.15"
futures = "0.3"
async-trait = "0.1"
bytes = "1"
aes-gcm = "0.11"
async-stream = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
aws-config = { version = "1.10", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.141", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "rustls"] }
llm-client = { path = "crates/llm-client" }
