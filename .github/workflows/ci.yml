name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Dependabot auto-merges use GITHUB_TOKEN, so GitHub suppresses the resulting
# push workflow. Run the extended evidence on that PR's merge candidate instead.
env:
  RUN_EXTENDED_DRILLS: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]' }}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unix-launcher:
    name: Unix Launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Self-check
        run: ./start.sh --check

  windows-launcher:
    name: Windows Launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Self-check
        shell: powershell
        run: .\start.ps1 -Check

  desktop-contract:
    name: Desktop Shell Contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-shell-windows
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build the desktop frontend
        working-directory: frontend
        run: pnpm build --mode desktop
      - name: Check desktop formatting
        run: cargo fmt --manifest-path frontend/src-tauri/Cargo.toml -- --check
      - name: Check desktop shell
        run: cargo check --manifest-path frontend/src-tauri/Cargo.toml
      - name: Test desktop runtime contracts
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml

  rust:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Specification conformance ledger
        run: sha256sum --check docs/SPEC_CONFORMANCE.sha256
      - name: Release manifest boundary
        shell: bash
        run: |
          set -euo pipefail
          manifest() {
            printf 'RELEASE_VERSION=v1.0.0\nRELEASE_GIT_SHA=%040d\n' 0
            for key in GATEWAY_IMAGE USER_SERVICE_IMAGE NOVEL_SERVICE_IMAGE \
              AGENT_SERVICE_IMAGE NARRATIVE_SERVICE_IMAGE FRONTEND_IMAGE \
              POSTGRES_IMAGE REDIS_IMAGE NGINX_IMAGE; do
              printf '%s=registry.example/novel@sha256:%064d\n' "$key" 0
            done
          }
          ./infra/docker/release.sh validate <(manifest)
          if ./infra/docker/release.sh validate \
            <(manifest; printf 'POSTGRES_PASSWORD=must-not-load\n') 2>/dev/null; then
            exit 1
          fi
          install -d -m 700 .release
          exec 9>.release/release.lock
          flock -n 9
          if ./infra/docker/release.sh restore 2>release-lock.err; then
            exit 1
          fi
          grep -Fx 'release: another release operation is running' release-lock.err
          exec 9>&-
          rm release-lock.err .release/release.lock
          rmdir .release
      - name: Verify the release/rollback state machine fails closed
        run: tests/e2e/release_state_drill.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Self-test backend architecture policy
        run: cargo run --locked -p architecture-check -- self-test
      - name: Enforce backend architecture boundaries
        run: cargo run --locked -p architecture-check -- check
      - name: Check
        run: cargo check --workspace --exclude integration-tests
      - name: Horizon 3 offline evaluation gate
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -p h3-eval -- --recorded --git-sha "$GITHUB_SHA" > /tmp/h3-eval-a.json
          cargo run --quiet -p h3-eval -- --recorded --git-sha "$GITHUB_SHA" > /tmp/h3-eval-b.json
          cmp /tmp/h3-eval-a.json /tmp/h3-eval-b.json
      - name: Horizon 1 extraction-quality evaluation gate
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet -p h1-eval -- --recorded --git-sha "$GITHUB_SHA" > /tmp/h1-eval-a.json
          cargo run --quiet -p h1-eval -- --recorded --git-sha "$GITHUB_SHA" > /tmp/h1-eval-b.json
          cmp /tmp/h1-eval-a.json /tmp/h1-eval-b.json
      - name: Horizon 3 LLM budget contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/llm-budget/test_verify.py
          python3 tools/llm-budget/verify.py \
            --policy tools/llm-budget/policy-v2.json \
            --metrics tools/llm-budget/recorded-release.prom \
            --commit "$GITHUB_SHA" > /tmp/llm-budget-a.json
          python3 tools/llm-budget/verify.py \
            --policy tools/llm-budget/policy-v2.json \
            --metrics tools/llm-budget/recorded-release.prom \
            --commit "$GITHUB_SHA" > /tmp/llm-budget-b.json
          cmp /tmp/llm-budget-a.json /tmp/llm-budget-b.json
      - name: Live qualification runner contract
        run: python3 tests/e2e/live_deepseek_journey.py --self-test
      - name: Horizon 5 capacity policy contract
        run: python3 tools/capacity/run.py --self-test
      - name: Test
        run: cargo test --workspace --exclude integration-tests
      - name: Clippy
        run: cargo clippy --workspace --exclude integration-tests --all-targets -- -D warnings
      - name: Audit dependencies for known vulnerabilities
        # rustsec/audit-check publishes a check run the org token cannot
        # create ("Resource not accessible by integration"), and Node 24
        # turns that publish failure into a hard step failure; run the
        # audit binary directly - the same tool and .cargo/audit.toml
        # the local gate uses.
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
          # Tauri 2's Linux GTK3 stack pins glib 0.18.5, but the resolved
          # application graph has no caller of RUSTSEC-2024-0429's affected API.
          # Keep that one reviewed exception explicit and reject new unsoundness.
          cargo audit --file frontend/src-tauri/Cargo.lock \
            --deny unsound \
            --ignore RUSTSEC-2024-0429
      - name: Enforce the dependency license and source policy
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command-arguments: licenses sources
      - name: Scan for committed secrets
        # gitleaks-action requires a paid GITLEAKS_LICENSE for
        # organization repositories, so run the open-source gitleaks
        # binary directly with the committed config (same image + config
        # the local self-test uses).
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --no-banner --config /repo/.gitleaks.toml --exit-code 2 \
            --log-opts HEAD --source /repo
      - name: Self-test the secret-scanning gate
        run: tests/e2e/gitleaks_self_test.sh

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Audit frontend production dependencies
        run: pnpm audit:dependencies
      - run: pnpm type-check
      - run: pnpm lint
      - name: Enforce strict FSD architecture boundaries
        run: pnpm lint:fsd
      - run: pnpm test
      - run: pnpm build

  frontend-a11y-browser:
    name: Frontend Browser A11y
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: VITE_API_URL=/api pnpm build
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run the browser accessibility gate
        run: pnpm exec playwright test

  integration:
    name: PostgreSQL & Redis Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start test dependencies
        run: docker compose -f docker-compose.test.yml up -d --wait test-postgres test-redis
      - name: Apply migrations
        run: docker compose -f docker-compose.test.yml run --rm test-migrate
      - name: Test production persistence adapters
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:25432/novelworld_test
          TEST_REDIS_URL: redis://localhost:26379
        run: cargo test -p integration-tests
      - name: Stop test dependencies
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  runtime:
    name: Production Compose Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CACHE_MODE: postgres
      REDIS_URL: memory://
      LLM_API_KEY: ''
      RATE_LIMIT_RPS: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate minimum-profile bootstrap roots
        run: |
          postgres_password=$(openssl rand -hex 16)
          jwt_secret=$(openssl rand -hex 32)
          runtime_key=$(openssl rand -hex 32)
          internal_token=$(openssl rand -hex 32)
          for value in "$postgres_password" "$jwt_secret" "$runtime_key" "$internal_token"; do
            echo "::add-mask::$value"
          done
          echo "POSTGRES_PASSWORD=$postgres_password" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "RUNTIME_CONFIG_KEY=$runtime_key" >> "$GITHUB_ENV"
          echo "INTERNAL_SERVICE_TOKEN=$internal_token" >> "$GITHUB_ENV"
      - name: Build and wait for the minimum production topology
        run: |
          docker compose -f docker-compose.yml up -d --build --wait --wait-timeout 180
          test -z "$(docker ps -a --filter name=^/novel-redis$ --format '{{.Names}}')"
          test "$(docker exec novel-agent-service printenv CACHE_MODE)" = postgres
      - name: Verify public probes and rate-limit exemption
        run: |
          docker exec novel-nginx nginx -T 2>&1 | grep -F 'limit_req_zone $binary_remote_addr zone=api_per_client:'
          docker exec novel-nginx nginx -T 2>&1 | grep -F 'limit_req zone=api_per_client burst=40 nodelay;'
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1/live
          for attempt in 1 2 3; do
            curl --fail --silent --show-error http://127.0.0.1/health
            curl --fail --silent --show-error http://127.0.0.1/ready
          done
      - name: Verify the nginx security headers
        run: |
          curl --silent --show-error --dump-header - --output /dev/null http://127.0.0.1/live             | grep -qi 'x-content-type-options: nosniff'
          curl --silent --show-error --dump-header - --output /dev/null http://127.0.0.1/live             | grep -qi 'x-frame-options: DENY'
          curl --silent --show-error --dump-header - --output /dev/null http://127.0.0.1/live             | grep -qi 'referrer-policy: same-origin'
      - name: Verify the gateway CORS posture
        run: |
          curl --silent --show-error --dump-header - --output /dev/null             -X OPTIONS -H 'Origin: http://localhost:5173'             -H 'Access-Control-Request-Method: POST'             http://127.0.0.1/api/auth/login             | grep -qi 'access-control-allow-origin: http://localhost:5173'
          ! curl --silent --show-error --dump-header - --output /dev/null             -X OPTIONS -H 'Origin: http://evil.example'             -H 'Access-Control-Request-Method: POST'             http://127.0.0.1/api/auth/login             | grep -qi 'access-control-allow-origin'
      - name: Verify durable first-admin setup
        run: |
          test "$(curl --silent --output /tmp/setup-status.json --write-out '%{http_code}' http://127.0.0.1/api/setup/status)" = 200
          grep -q '"configured":false' /tmp/setup-status.json
          grep -q '"llm_configured":false' /tmp/setup-status.json
          grep -q '"contract":4' /tmp/setup-status.json
          sleep 2
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"email":"pre-setup@test.invalid","password":"RuntimeSmokeOnly123!"}' \
            http://127.0.0.1/api/auth/register)" = 409
          sleep 2
          test "$(curl --silent --output /tmp/setup-init.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"email":"admin@test.invalid","password":"RuntimeSmokeOnly123!","name":"Runtime Admin"}' \
            http://127.0.0.1/api/setup/init)" = 201
          sleep 2
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"email":"second@test.invalid","password":"RuntimeSmokeOnly123!"}' \
            http://127.0.0.1/api/setup/init)" = 409
          docker restart novel-user-service
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' novel-user-service 2>/dev/null)" = healthy ]; then
              break
            fi
            sleep 1
          done
          sleep 1
          test "$(curl --silent --output /tmp/setup-status.json --write-out '%{http_code}' http://127.0.0.1/api/setup/status)" = 200
          grep -q '"configured":true' /tmp/setup-status.json
          grep -q '"llm_configured":false' /tmp/setup-status.json
          sleep 2
          token=$(python3 -c 'import json; print(json.load(open("/tmp/setup-init.json"))["access_token"])')
          for attempt in 1 2 3; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H 'Authorization: Bearer invalid' http://127.0.0.1/api/auth/me)" = 401
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $token" http://127.0.0.1/api/auth/me)" = 200
      - name: Switch atomically to the explicit Redis and LLM profile
        run: |
          redis_password="Aa0._~-Z$(openssl rand -hex 16)"
          llm_api_key="sk-$(openssl rand -hex 24)"
          echo "::add-mask::$redis_password"
          echo "::add-mask::$llm_api_key"
          echo "CACHE_MODE=redis" >> "$GITHUB_ENV"
          echo "REDIS_PASSWORD=$redis_password" >> "$GITHUB_ENV"
          echo "REDIS_URL=redis://:$redis_password@redis:6379" >> "$GITHUB_ENV"
          echo "LLM_API_KEY=$llm_api_key" >> "$GITHUB_ENV"
          echo "COMPOSE_PROFILES=redis" >> "$GITHUB_ENV"
          export CACHE_MODE=redis REDIS_PASSWORD="$redis_password"
          export REDIS_URL="redis://:$redis_password@redis:6379" LLM_API_KEY="$llm_api_key"
          export COMPOSE_PROFILES=redis
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile redis \
            up -d --wait --wait-timeout 180
          docker exec novel-nginx nginx -s reload
          curl --connect-timeout 2 --max-time 5 --retry 5 --retry-all-errors \
            --retry-delay 1 --retry-max-time 15 --fail --silent --show-error \
            http://127.0.0.1/ready >/dev/null
          test "$(docker inspect --format '{{.State.Health.Status}}' novel-redis)" = healthy
          test "$(docker exec novel-agent-service printenv CACHE_MODE)" = redis
      - name: Verify dependency failure semantics
        run: |
          docker stop novel-redis
          test "$(docker exec novel-agent-service curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8003/health)" = 200
          test "$(docker exec novel-agent-service curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8003/ready)" = 503
          test "$(docker exec novel-gateway curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/live)" = 200
          for attempt in $(seq 1 10); do
            if [ "$(docker exec novel-gateway curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/health)" = 503 ]; then
              break
            fi
            sleep 1
          done
          test "$(docker exec novel-gateway curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/health)" = 503
          docker start novel-redis
          for attempt in $(seq 1 30); do
            if [ "$(docker exec novel-gateway curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ready)" = 200 ]; then
              break
            fi
            sleep 2
          done
          test "$(docker exec novel-gateway curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ready)" = 200
          docker stop novel-novel-service
          test "$(docker exec novel-agent-service curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8003/health)" = 200
          test "$(docker exec novel-agent-service curl --max-time 3 --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8003/ready)" = 503
          test "$(docker exec novel-narrative-service curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8004/health)" = 200
          test "$(docker exec novel-narrative-service curl --max-time 3 --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8004/ready)" = 503
          for attempt in $(seq 1 10); do
            if [ "$(docker exec novel-gateway curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ready)" = 503 ]; then
              break
            fi
            sleep 1
          done
          test "$(docker exec novel-gateway curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ready)" = 503
          docker start novel-novel-service
          for attempt in $(seq 1 30); do
            if [ "$(docker exec novel-gateway curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ready)" = 200 ]; then
              break
            fi
            sleep 2
          done
          test "$(docker exec novel-gateway curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ready)" = 200
          docker stop novel-narrative-service
          test "$(docker exec novel-agent-service curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8003/health)" = 200
          test "$(docker exec novel-agent-service curl --max-time 3 --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8003/ready)" = 503
          for attempt in $(seq 1 10); do
            if [ "$(docker exec novel-gateway curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ready)" = 503 ]; then
              break
            fi
            sleep 1
          done
          test "$(docker exec novel-gateway curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ready)" = 503
          docker start novel-narrative-service
          for attempt in $(seq 1 30); do
            if [ "$(docker exec novel-gateway curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ready)" = 200 ]; then
              break
            fi
            sleep 2
          done
          test "$(docker exec novel-gateway curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ready)" = 200
      - name: Self-check ingestion recovery verifier
        run: tests/e2e/ingestion_recovery.sh --self-test
      - name: Self-check source recovery verifier
        run: tests/e2e/source_recovery_drill.sh --self-test
      - name: Self-check secret rotation verifier
        run: tests/e2e/secret_rotation_drill.sh --self-test
      - name: Verify restart-safe ingestion recovery boundaries
        if: env.RUN_EXTENDED_DRILLS == 'true'
        run: tests/e2e/ingestion_recovery.sh
      - name: Verify restart-safe core reader loop
        if: env.RUN_EXTENDED_DRILLS == 'true'
        run: tests/e2e/core_reader_loop.sh
      - name: Verify the provider-outage fail-closed drill
        if: env.RUN_EXTENDED_DRILLS == 'true'
        run: tests/e2e/provider_outage_drill.sh
      - name: Run the backup-restore-v1 drills
        if: env.RUN_EXTENDED_DRILLS == 'true'
        env:
          BACKUP_ENCRYPTION_KEY: runtime-drill-backup-key-at-least-32-characters
        run: tests/e2e/backup_restore_drill.sh
      - name: Start the S3 source-retention topology
        if: env.RUN_EXTENDED_DRILLS == 'true'
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile redis down -v
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.s3-e2e.yml --profile redis up -d
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' novel-gateway 2>/dev/null)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.s3-e2e.yml --profile redis ps --all
          exit 1
      - name: Verify the S3 source-boundary kill/restart drill
        if: env.RUN_EXTENDED_DRILLS == 'true'
        run: tests/e2e/source_recovery_drill.sh
      - name: Verify the structured log contract
        if: env.RUN_EXTENDED_DRILLS == 'true'
        run: python3 tests/e2e/log_contract.py
      - name: Verify the secret rotation drill
        if: env.RUN_EXTENDED_DRILLS == 'true'
        env:
          COMPOSE_FILES: docker-compose.yml:docker-compose.e2e.yml:docker-compose.s3-e2e.yml
        run: tests/e2e/secret_rotation_drill.sh
      - name: Verify the bad-release edge envelope drill
        if: env.RUN_EXTENDED_DRILLS == 'true'
        run: tests/e2e/bad_release_drill.sh
      - name: Show S3 topology logs on failure
        if: failure() && env.RUN_EXTENDED_DRILLS == 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.s3-e2e.yml --profile redis logs --no-color || true
      - name: Stop the S3 source-retention topology
        if: always() && env.RUN_EXTENDED_DRILLS == 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.s3-e2e.yml --profile redis down -v
      - name: Reset production topology for the capacity profile
        if: env.RUN_EXTENDED_DRILLS == 'true'
        env:
          RATE_LIMIT_RPS: 500
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile redis down -v
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile redis up -d
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' novel-gateway 2>/dev/null)" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify the single-node-v1 capacity SLO
        if: env.RUN_EXTENDED_DRILLS == 'true'
        run: |
          python3 tools/capacity/run.py \
            --policy tools/capacity/policy-v1.json \
            --report capacity-report.json \
            --git-sha "$GITHUB_SHA"
      - name: Upload capacity report
        if: always() && env.RUN_EXTENDED_DRILLS == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single-node-v1-${{ github.sha }}
          path: capacity-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile redis logs --no-color || true
      - name: Stop production topology
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile redis down -v
