name: Docker Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  desktop:
    needs: quality
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: read

  rust-services:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - gateway
          - user-service
          - novel-service
          - agent-service
          - narrative-service
    steps:
      - uses: actions/checkout@v7.0.1
      - id: image
        run: echo "prefix=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./infra/docker/Dockerfile.rust-service
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.image.outputs.prefix }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=rust-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=rust-${{ matrix.service }}
      - name: Scan the pushed image for HIGH/CRITICAL vulnerabilities
        timeout-minutes: 15
        env:
          IMAGE: ${{ steps.image.outputs.prefix }}-${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-version-check "$IMAGE"
          mkdir -p image-digests
          printf '%s\n' "$IMAGE" > "image-digests/${{ matrix.service }}.txt"
      - uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 5
        with:
          name: release-image-digest-${{ matrix.service }}-${{ github.sha }}
          path: image-digests/${{ matrix.service }}.txt
          if-no-files-found: error

  frontend:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - id: image
        run: echo "prefix=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Scan the pushed image for HIGH/CRITICAL vulnerabilities
        timeout-minutes: 15
        env:
          IMAGE: ${{ steps.image.outputs.prefix }}-frontend@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-version-check "$IMAGE"
          mkdir -p image-digests
          printf '%s\n' "$IMAGE" > image-digests/frontend.txt
      - uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 5
        with:
          name: release-image-digest-frontend-${{ github.sha }}
          path: image-digests/frontend.txt
          if-no-files-found: error

  release-manifest:
    needs: [rust-services, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        timeout-minutes: 5
        with:
          pattern: release-image-digest-*-${{ github.sha }}
          path: build-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable images and record digests
        id: manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_GIT_SHA: ${{ github.sha }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
          [[ "$RELEASE_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          image_prefix=$(printf '%s' "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')
          printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" > release.env
          printf 'RELEASE_GIT_SHA=%s\n' "$RELEASE_GIT_SHA" >> release.env

          record_pinned_image() {
            local key="$1" image="$2" expected actual
            [[ "$image" =~ ^[a-z0-9][a-z0-9._/:@-]*@sha256:[0-9a-f]{64}$ ]]
            expected=${image##*@}
            actual=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
            [[ "$actual" = "$expected" ]]
            printf '%s=%s\n' "$key" "$image" >> release.env
          }

          infra/docker/record-application-images.sh build-digests "$image_prefix" >> release.env

          compose_postgres_password=$(openssl rand -hex 16)
          compose_redis_password="Aa0._~-Z$(openssl rand -hex 16)"
          compose_jwt_secret=$(openssl rand -hex 32)
          compose_runtime_key=$(openssl rand -hex 32)
          compose_internal_token=$(openssl rand -hex 32)
          compose_llm_key="sk-$(openssl rand -hex 24)"
          compose_json=$(POSTGRES_PASSWORD="$compose_postgres_password" \
            CACHE_MODE=redis REDIS_PASSWORD="$compose_redis_password" \
            REDIS_URL="redis://:$compose_redis_password@redis:6379" \
            JWT_SECRET="$compose_jwt_secret" RUNTIME_CONFIG_KEY="$compose_runtime_key" \
            INTERNAL_SERVICE_TOKEN="$compose_internal_token" LLM_API_KEY="$compose_llm_key" \
            docker compose --profile redis config --format json)
          postgres_image=$(jq -r '.services.postgres.image' <<<"$compose_json")
          [[ $(jq -r '.services["postgres-migrate"].image' <<<"$compose_json") = "$postgres_image" ]]
          record_pinned_image POSTGRES_IMAGE "$postgres_image"
          record_pinned_image REDIS_IMAGE "$(jq -r '.services.redis.image' <<<"$compose_json")"
          record_pinned_image NGINX_IMAGE "$(jq -r '.services.nginx.image' <<<"$compose_json")"
          infra/docker/release.sh validate release.env

          # SBOM generation: one CycloneDX 1.7 document per application image.
          mkdir -p sboms
          mapfile -t app_images < <(awk -F= '/^(GATEWAY|USER_SERVICE|NOVEL_SERVICE|AGENT_SERVICE|NARRATIVE_SERVICE|FRONTEND)_IMAGE=/{print $2}' release.env)
          [[ "${#app_images[@]}" -eq 6 ]]
          infra/security/generate-sboms.sh sboms "${app_images[@]}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: novel-world-release-${{ github.sha }}
          path: |
            release.env
            sboms/

  release-attestation:
    needs: [release-manifest, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        timeout-minutes: 5
        with:
          name: novel-world-release-${{ github.sha }}
          path: server-assets
      - uses: actions/download-artifact@v8.0.1
        timeout-minutes: 5
        with:
          pattern: novelworld-*
          path: release-assets
          merge-multiple: true
      - name: Prepare release files and pinned native verifier
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA" ]] || {
            echo '::error::Source and signing workflow must resolve to the same commit'
            exit 1
          }
          cp server-assets/release.env server-assets/sboms/* release-assets/
          (cd release-assets && sha256sum novelworld-* > desktop-SHA256SUMS)

          cli_dir="$RUNNER_TEMP/release-attestation-cli"
          mkdir -p "$cli_dir"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 \
            https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz \
            --output "$cli_dir/gh.tar.gz"
          printf '%s  %s\n' e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be \
            "$cli_dir/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$cli_dir/gh.tar.gz" -C "$cli_dir" --strip-components=2 gh_2.100.0_linux_amd64/bin/gh
          echo "$cli_dir" >> "$GITHUB_PATH"
          # Trust comes from the CLI's independent distribution, never release assets.
          timeout --kill-after=10s 120s "$cli_dir/gh" attestation trusted-root \
            > "$RUNNER_TEMP/release-trusted-root.jsonl"
      - name: Attest every release file
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        timeout-minutes: 10
        with:
          subject-path: release-assets/*
      - name: Verify file provenance and native rejection cases
        timeout-minutes: 10
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" release-assets/release-attestation.json
          tests/e2e/release_attestation_check.sh release-assets "$GITHUB_SHA" \
            "$RUNNER_TEMP/release-trusted-root.jsonl"
      - uses: actions/upload-artifact@v7.0.1
        timeout-minutes: 5
        with:
          name: release-files-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-attestation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        timeout-minutes: 5
        with:
          name: release-files-${{ github.sha }}
          path: release-assets
      - name: Publish server and desktop assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          cd release-assets

          state=missing
          if state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            :
          else
            flags=(--verify-tag --draft --generate-notes)
            [[ "$tag" == *-* ]] && flags+=(--prerelease)
            gh release create "$tag" "${flags[@]}"
            state=true
          fi

          gh release upload "$tag" ./* --clobber
          [[ "$state" == false ]] || gh release edit "$tag" --draft=false
