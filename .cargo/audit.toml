[advisories]
ignore = [
    # rustls-webpki 0.101.7 (RUSTSEC-2026-0098/0099/0104): transitive via
    # aws-smithy-http-client 1.3.0 (the latest) -> aws-config/aws-sdk-s3.
    # No patched release exists in the 0.101 line; the fixes land in 0.103+,
    # which the AWS SDK does not consume yet. 0098/0099 require a misissued
    # certificate to exploit, and 0104 is a panic in CRL parsing; the S3
    # client targets operator-managed endpoints. Re-check whenever the AWS
    # SDK chain updates.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # h2 0.3.27 (RUSTSEC-2026-0258, unbounded empty DATA frames): transitive
    # via the already-latest aws-smithy-http-client 1.3.0; patched only in
    # h2 0.4.16+, which the AWS SDK does not consume yet. Exploitable only
    # against a hostile HTTP/2 server; the S3 client targets
    # operator-managed endpoints. Re-check on AWS chain updates.
    "RUSTSEC-2026-0258",
]

# ttf-parser (unmaintained) and lru 0.16.4 (unsound pop, patched in 0.18.2)
# remain informational warnings: both are transitive through already-latest
# upstream releases and do not fail the gate. They move to ignores only if
# they become release-blocking with an actionable fix.
